<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3K3 — Live Online Riders</title>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('current_admin');
        var token = localStorage.getItem('k3k3_admin_token');
        if (!token && !raw) {
          window.location.replace('adminlogin.html');
          return;
        }
        var user = JSON.parse(raw || '{}');
        var role = (user.role || '').toLowerCase();
        var allowed = (user.allowedPages || user.allowed_pages || []).map(function(p){ return p.toLowerCase(); });
        var targetFile = 'live-riders.html'.toLowerCase();

        // Super Admin always allowed
        if (role !== 'admin') {
          var isAllowed = allowed.includes(targetFile);
          if (!isAllowed) {
            var fb = user.defaultPage || 'payment-management.html';
            alert('Access Restricted\n\nYour assigned role (' + (user.roleName || user.role) + ') does not have permission to access Live Online Riders.\nRedirecting to your workspace...');
            window.location.replace(fb);
            return;
          }
        }
      } catch(_) {}
      var target = 'admin-dashboard.html?section=riders' + (window.location.hash || '#riders');
      window.location.replace(target);
    })();
  </script>
  <style>
    body { background: #0c0d10; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,214,10,0.2); border-top-color: #FFD60A; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading Live Online Riders...</p>
</body>
</html>
