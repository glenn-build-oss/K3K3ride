<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3K3 — Platform Command Center</title>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('current_admin');
        var token = localStorage.getItem('k3k3_admin_token');
        if (!token && !raw) {
          window.location.replace('adminlogin.html');
          return;
        }
        var user = JSON.parse(raw || '{}');
        var role = (user.role || '').toLowerCase();
        if (role !== 'admin') {
          var fb = user.defaultPage || (role === 'support' ? 'ride-monitoring.html' : (role === 'audit' ? 'trips.html' : 'payment-management.html'));
          window.location.replace(fb);
          return;
        }
      } catch(_) {}
      window.location.replace('admin-dashboard.html?section=dashboard#dashboard');
    })();
  </script>
  <style>
    body { background: #0c0d10; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,214,10,0.2); border-top-color: #FFD60A; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading Platform Command Center...</p>
</body>
</html>
